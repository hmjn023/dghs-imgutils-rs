name: Build and release native bindings

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-gnu
          - runner: windows-2022
            target: win32-x64-msvc
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'linux-x64-gnu'
        run: node --test tests/install-native.test.mjs
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Check native binding loads
        run: node -e "const addon = require('./index.js'); if (typeof addon.getVersion !== 'function') throw new Error('Missing getVersion export'); console.log(addon.getVersion())"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dghs-imgutils-rs.${{ matrix.target }}.node
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-x64-gnu'
        with:
          name: bindings
          path: |
            index.js
            index.d.ts
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release version'; exit 1; }
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [[ $(cat /tmp/release-draft) == false ]]; then
              echo "$tag is already published; skipping release."
              exit 0
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag exists without a release; refusing to overwrite it."
            exit 1
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$tag" --generate-notes
          fi
          target_sha=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          [[ "$target_sha" == "$GITHUB_SHA" ]] || { echo "Draft release $tag points to another commit"; exit 1; }
          (cd release-assets && sha256sum index.js index.d.ts dghs-imgutils-rs.*.node > SHA256SUMS)
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false
