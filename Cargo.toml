[package]
name = "dghs-imgutils-rs"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "adversarial_bench"
path = "benches/adversarial_bench.rs"

[dependencies]
csv = "1.4.0"
hf-hub = "0.5.0"
image = "0.25.10"
ndarray = "0.17.2"
once_cell = "1.21.4"
ort = {
    version = "2.0.0-rc.12",
    default-features = false,
    features = ["api-24", "load-dynamic", "ndarray", "tracing"],
}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
pathfinding = "4.12.0"
imageproc = "0.25.0"
ab_glyph = "0.2.28"
lru = "0.12"
libloading = "0.9"
png = "0.17"
flate2 = "1.1"
ureq = "2"
base64 = "0.22"
regex = "1.11"
url = "2"
tar = "0.4"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
napi = { version = "2.16.11", features = ["async", "serde-json", "napi4"], optional = true }
napi-derive = { version = "2.16.9", optional = true }

[build-dependencies]
napi-build = "2.1.4"

[dev-dependencies]
tempfile = "3"

[features]
default = ["napi"]
# Convenience aggregate; directml is Windows-only and the AMD providers
# require their vendor SDK/runtime on the target system.
all-providers = ["cuda", "tensorrt", "directml", "openvino", "amd-gpu", "amd-npu"]
napi = ["dep:napi", "dep:napi-derive"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
directml = ["ort/directml"]
openvino = ["ort/openvino"]
amd-gpu = ["ort/migraphx"]
amd-npu = ["ort/vitis"]
